# The pull-request lane from README.md, which every project calls from its own
# workflow (BASE-25). A project calls it from a job named `lane`, so a pull
# request shows the check as `lane / lane`, and names this file at a commit:
#
#   uses: crumbkit/rust-standards/.github/workflows/rust-lane.yml@<commit>
#
# templates/ci.yml is such a caller. Dependabot moves the commit.
name: rust-lane

on:
  workflow_call:
    inputs:
      library:
        description: Adds the `features` step, for a project that adopts the library profile (LIB-5).
        type: boolean
        default: false
      timeout-minutes:
        description: The lane's time budget, which the map's `lanes` decision states (BASE-25).
        type: number
        default: 10
      working-directory:
        description: The directory of the Cargo workspace, relative to the repository's root.
        type: string
        default: .

# The job grants only the permissions it needs.
permissions: {}

env:
  # Any compiler or Clippy warning fails the build (BASE-1).
  CARGO_BUILD_WARNINGS: deny
  CARGO_TERM_COLOR: always
  # The gitleaks release that the `secrets` step runs, and the SHA-256 of its
  # linux_x64 archive from the release's checksums file.
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  lane:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read # actions/checkout reads the repository.
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      # The full history lets the `secrets` step read every commit that the
      # pull request or push adds.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # rustup installs the version and components that rust-toolchain.toml
      # names (BASE-26).
      - run: rustup toolchain install
      # install-action runs before rust-cache, so the cache leaves out the
      # tool binaries that install-action downloads on every run.
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest@0.9.140,cargo-deny@0.20.2,cargo-shear@1.14.0,zizmor@1.30.1,cargo-hack@0.6.46
          fallback: none
      # gitleaks-action needs a paid licence key in an organisation's
      # repositories, so the lane installs the release binary and checks it
      # against its SHA-256 before it runs.
      - name: install gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir gitleaks
          tar --extract --gzip --file "$archive" --directory gitleaks gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      # The steps that read only the source run first, so a pull request
      # that fails one of them fails in seconds.
      - name: format
        run: cargo fmt --check
      # zizmor reads every workflow in the repository, wherever the Cargo
      # workspace is.
      - name: workflows
        run: zizmor "$GITHUB_WORKSPACE"
      # gitleaks reads the commits that the pull request or push adds. A push
      # whose previous commit is absent, such as a branch's first push, and
      # any other event read the checked-out commit alone. gitleaks reads
      # .gitleaks.toml and .gitleaksignore at the repository's root.
      - name: secrets
        working-directory: ${{ github.workspace }}
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ "$EVENT" = push ] && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            range="$PUSH_BEFORE..$PUSH_AFTER"
          else
            range="-1 $PUSH_AFTER"
          fi
          echo "gitleaks reads the commits in: $range"
          gitleaks git --no-banner --redact --verbose --log-opts="$range" .
      # Only a run on main saves the cache.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ${{ inputs.working-directory }} -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: deny
        run: cargo deny --locked check bans licenses sources
      - name: shear
        run: cargo shear
      - name: clippy
        run: cargo clippy --locked --workspace --all-targets --all-features
      - name: tests
        run: cargo nextest run --locked --workspace --all-features
      # Cargo refuses `--doc` in a workspace with no library target, so the
      # `doctests` and `rustdoc` steps run only when a package has one.
      - name: library targets
        id: targets
        run: |
          count=$(cargo metadata --locked --no-deps --format-version 1 \
            | jq '[.packages[].targets[].kind[] | select(. == "lib" or . == "rlib" or . == "dylib" or . == "proc-macro")] | length')
          if [ "$count" -gt 0 ]; then
            echo "library=true" >> "$GITHUB_OUTPUT"
          else
            echo "library=false" >> "$GITHUB_OUTPUT"
          fi
      - name: doctests
        if: steps.targets.outputs.library == 'true'
        run: cargo test --locked --doc --workspace --all-features
      - name: rustdoc
        if: steps.targets.outputs.library == 'true'
        run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      # A project that adopts the library profile builds each feature alone
      # (LIB-5).
      - name: features
        if: inputs.library
        run: cargo hack clippy --locked --workspace --each-feature --all-targets
