# The clippy.toml entries that the service profile adds (SVC-1, SVC-12).

disallowed-methods = [
    { path = "std::thread::spawn", reason = "spawn through the task owner, which joins or aborts" },
    { path = "tokio::spawn", reason = "spawn through the task owner, which joins or aborts", allow-invalid = true },
    { path = "tokio::task::spawn", reason = "spawn through the task owner, which joins or aborts", allow-invalid = true },
    { path = "tokio::task::spawn_blocking", reason = "spawn through the task owner, which joins or aborts", allow-invalid = true },
]

# SVC-12: list the client types and constructors of each store's SDK or
# driver, and name the owning module in each reason, such as
# { path = "aws_sdk_sqs::Client", reason = "use the ticket queue in src/queue.rs" }
# or { path = "sqlx::PgPool", reason = "use the store in src/store.rs" }.
disallowed-types = []
