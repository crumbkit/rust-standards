# A workflow that runs the pull-request lane and the scheduled advisory check
# from README.md. A project copies it to .github/workflows/ci.yml, replaces
# <commit> with the commit of this repository that its map's
# `standards.commit` names, and records the lanes in its map's `lanes`
# decision (BASE-25). The `lane` job calls the shared lane, so a pull request
# shows the check as `lane / lane`, and branch protection requires that name.
# A project adds its own jobs, such as a macOS build, after the two jobs here.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "43 6 * * *"
  workflow_dispatch:

# Each job grants only the permissions it needs.
permissions: {}

# A new push cancels the run for the previous push, because the newer run
# checks the same changes and more.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lane:
    if: github.event_name != 'schedule'
    permissions:
      contents: read # actions/checkout reads the repository.
    uses: crumbkit/rust-standards/.github/workflows/rust-lane.yml@<commit>
    with:
      # A project that adopts the library profile sets `library: true`,
      # which adds the `features` step (LIB-5).
      library: false
      # The pull-request lane's time budget (BASE-25).
      timeout-minutes: 10

  advisories:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # actions/checkout reads the repository.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2
          fallback: none
      - name: advisories
        run: cargo deny --locked check advisories
