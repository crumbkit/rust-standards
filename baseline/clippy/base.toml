# The clippy.toml entries for every project. A project replaces each reason
# with the path of its own owning module (BASE-5). A project also adds the
# paths of its HTTP and database clients to `disallowed-methods` and
# `disallowed-types`, because the baseline cannot know which it uses.

allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-dbg-in-tests = true
allow-print-in-tests = true
allow-indexing-slicing-in-tests = true
too-many-lines-threshold = 150 # BASE-10
max-fn-params-bools = 3 # BASE-16

disallowed-methods = [
    # BASE-6
    { path = "std::env::var", reason = "read the environment snapshot" },
    { path = "std::env::var_os", reason = "read the environment snapshot" },
    { path = "std::env::vars", reason = "only the entry point captures the environment" },
    { path = "std::env::vars_os", reason = "only the entry point captures the environment" },
    { path = "std::env::set_var", reason = "build a snapshot in the test instead" },
    { path = "std::env::remove_var", reason = "build a snapshot in the test instead" },
    { path = "std::env::current_dir", reason = "read the directory from the snapshot" },
    { path = "std::env::set_current_dir", reason = "pass the directory to the operation instead" },
    # BASE-5: the clock
    { path = "std::time::Instant::now", reason = "read the time from the clock owner" },
    { path = "std::time::SystemTime::now", reason = "read the time from the clock owner" },
    # BASE-5: the file system
    { path = "std::fs::read", reason = "read files through the file system owner" },
    { path = "std::fs::read_to_string", reason = "read files through the file system owner" },
    { path = "std::fs::write", reason = "write files through the file system owner" },
    { path = "std::fs::File::open", reason = "open files through the file system owner" },
    { path = "std::fs::File::create", reason = "create files through the file system owner" },
    # BASE-5: the network
    { path = "std::net::TcpStream::connect", reason = "connect through the network owner" },
    # BASE-5: the standard streams
    { path = "std::io::stdin", reason = "read through the standard-stream owner" },
    { path = "std::io::stdout", reason = "write through the standard-stream owner" },
    { path = "std::io::stderr", reason = "write through the standard-stream owner" },
    # BASE-7
    { path = "std::process::exit", reason = "return the exit code from main so destructors run" },
    # BASE-11
    { path = "std::thread::sleep", reason = "wait for an observable signal, or sleep in the clock owner" },
    { path = "tokio::time::sleep", reason = "wait for an observable signal, or sleep in the clock owner", allow-invalid = true },
]

# BASE-5 names the standard-stream macros. BASE-7: also list the untyped-error
# macros of the project's error crates, such as `anyhow::anyhow`,
# `anyhow::bail` or `miette::miette`.
disallowed-macros = [
    { path = "std::println", reason = "write through the standard-stream owner" },
    { path = "std::eprintln", reason = "write through the standard-stream owner" },
    { path = "std::print", reason = "write through the standard-stream owner" },
    { path = "std::eprint", reason = "write through the standard-stream owner" },
]
